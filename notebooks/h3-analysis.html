      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

l, "disabled": false, "hide_code": false}, "id": "Hstk", "name": "_"}, {"code": "", "code_hash": "68bfd7bcd06e47185a3a80e726993f5b", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "nWHF", "name": "_"}, {"code": "", "code_hash": "6c6a6b3c48d823b77bd8ac55f3368a06", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "iLit", "name": "_"}, {"code": "", "code_hash": "77e20af23fa539e012b175c52218b0d0", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "ZHCJ", "name": "_"}, {"code": "", "code_hash": "9145400fbb33a2d9e0efd1e52da9ca36", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "ROlb", "name": "_"}, {"code": "", "code_hash": "c772cf276ac7e79ffc7b54c03f84780d", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "qnkX", "name": "_"}, {"code": "", "code_hash": "689df6895fb39934166dff14849f4d96", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "TqIu", "name": "_"}, {"code": "", "code_hash": "3e6700e9f22a6cf94ea2160c74799b16", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "Vxnm", "name": "_"}, {"code": "", "code_hash": null, "config": {"column": null, "disabled": false, "hide_code": false}, "id": "DnEU", "name": "_"}], "metadata": {"marimo_version": "0.23.13"}, "version": "1"},
            "session": {"cells": [{"code_hash": "1d0db38904205bec4d6f6f6a1f6cec3e", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e61a499274082dfe34c6d02d3a6bc944", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"h3-analysis\"\u003EH3 Analysis\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EAssessing the suitability of Uber's H3 grid for crime concentration and hotspot analysis.\u003C/span\u003E\n\u003Ch2 id=\"pros-and-cons-of-h3\"\u003EPros and Cons of H3\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u2705 Good for consistent and extremely efficient spatial indexing\u003C/li\u003E\n\u003Cli\u003E\u2705 Homogeneous neighbour relationship (edge-edge)\u003C/li\u003E\n\u003Cli\u003E\u2705 Extremely fast conversion of points to cells (non-spatial operation)\u003C/li\u003E\n\u003Cli\u003E\u274c Fixed resolutions with a sevenfold size factor\u003C/li\u003E\n\u003Cli\u003E\u274c Not truly hierarchical\u003C/li\u003E\n\u003Cli\u003E\u274c Can be affected by areal distortion\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\"investigations\"\u003EInvestigations\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EWe focus on two of the cons in this notebook:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EH3 cells vary in size non-significantly, due to \u003Ca href=\"https://observablehq.com/@fil/h3-oddities\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Eicosahedral distortion\u003C/a\u003E. We assess the impact of this on enumerating crime hotspots.\u003C/li\u003E\n\u003Cli\u003EHow likely are points to be non-hierarchical? A point in a child cell may be outside the parent cell, or conversely\na point in a parent might not be in any of it's 7 child cells. This will affect aggregation - we cannot assume summing the counts in child cells will get a correct parent cell count.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\"references\"\u003EReferences\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://www.uber.com/gb/en/blog/h3/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ehttps://www.uber.com/gb/en/blog/h3/\u003C/a\u003E\u003C/span\u003E\n\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003EThis notebook uses data from the safer-streets project's Azure blob storage. It requires a connection string, to which\n\u003Ccode\u003EAZURE_STORAGE_CONNSTR\u003C/code\u003E should be set. Use of a .env file is strongly encouraged.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "99ace4482b57403ffadae5823eea6a28", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "d3fbf7f9038846902a615f32a3fd536d", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "68a657a1f7edcdf12844035668159a70", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "7334caeced9d129af8ed7f6d533bc73b", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"get-all-the-pfa-names\"\u003EGet all the PFA names\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EWe'll need them later...\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "89d3a7debe37840e79b978438c82c176", "console": [], "id": "Xref", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='Xref-0' random-id='7e5336fe-6e47-90bc-8539-9108ee9819fc'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;spatial_id\u0026#92;\u0026quot;:\u0026#92;\u0026quot;E23000001\u0026#92;\u0026quot;,\u0026#92;\u0026quot;pfa23nm\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Metropolitan Police\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;spatial_id\u0026#92;\u0026quot;:\u0026#92;\u0026quot;E2
