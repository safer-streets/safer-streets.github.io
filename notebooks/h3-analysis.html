      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "1d0db38904205bec4d6f6f6a1f6cec3e", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e61a499274082dfe34c6d02d3a6bc944", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"h3-analysis\"\u003EH3 Analysis\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EAssessing the suitability of Uber's H3 grid for crime concentration and hotspot analysis.\u003C/span\u003E\n\u003Ch2 id=\"pros-and-cons-of-h3\"\u003EPros and Cons of H3\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u2705 Good for consistent and extremely efficient spatial indexing\u003C/li\u003E\n\u003Cli\u003E\u2705 Homogeneous neighbour relationship (edge-edge)\u003C/li\u003E\n\u003Cli\u003E\u2705 Extremely fast conversion of points to cells (non-spatial operation)\u003C/li\u003E\n\u003Cli\u003E\u274c Fixed resolutions with a sevenfold size factor\u003C/li\u003E\n\u003Cli\u003E\u274c Not truly hierarchical\u003C/li\u003E\n\u003Cli\u003E\u274c Can be affected by areal distortion\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\"investigations\"\u003EInvestigations\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EWe focus on two of the cons in this notebook:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EH3 cells vary in size non-significantly, due to \u003Ca href=\"https://observablehq.com/@fil/h3-oddities\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Eicosahedral distortion\u003C/a\u003E. We assess the impact of this on enumerating crime hotspots.\u003C/li\u003E\n\u003Cli\u003EHow likely are points to be non-hierarchical? A point in a child cell may be outside the parent cell, or conversely\na point in a parent might not be in any of it's 7 child cells. This will affect aggregation - we cannot assume summing the counts in child cells will get a correct parent cell count.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\"references\"\u003EReferences\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://www.uber.com/gb/en/blog/h3/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ehttps://www.uber.com/gb/en/blog/h3/\u003C/a\u003E\u003C/span\u003E\n\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003EThis notebook uses data from the safer-streets project's Azure blob storage. It requires a connection string, to which\n\u003Ccode\u003EAZURE_STORAGE_CONNSTR\u003C/code\u003E should be set. Use of a .env file is strongly encouraged.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "99ace4482b57403ffadae5823eea6a28", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "d3fbf7f9038846902a615f32a3fd536d", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "68a657a1f7edcdf12844035668159a70", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "7334caeced9d129af8ed7f6d533bc73b", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"get-all-the-pfa-names\"\u003EGet all the PFA names\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EWe'll need them later...\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8bb3f77c222a37d122561146f42b2d86", "console": [], "id": "Xref", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='Xref-0' random-id='2c08896a-a2e0-ca1e-558e-1d4aaded8ddb'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;spatial_id\u0026#92;\u0026quot;:\u0026#92;\u0026quot;E23000001\u0026#92;\u0026quot;,\u0026#92;\u0026quot;pfa24nm\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Metropolitan Police\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;spatial_id\u0026#92;\u0026quot;:\u0026#92;\u0026quot;E2  directly from the point\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ECompute the proportion of these points that are not in their parent cell, or not in their grandparent cell.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6c2be683e177c81c7c9509d9ed66edec", "console": [], "id": "TqIu", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 1rem'\u003E\u003Cmarimo-stat data-value='\u0026quot;6.95%\u0026quot;' data-label='\u0026quot;Not in parent cell\u0026quot;' data-caption='\u0026quot;res-9 cell\u0026#x27;s parent \u2260 direct res-8 cell\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003Cmarimo-stat data-value='\u0026quot;6.14%\u0026quot;' data-label='\u0026quot;Not in grandparent cell\u0026quot;' data-caption='\u0026quot;res-9 cell\u0026#x27;s grandparent \u2260 direct res-7 cell\u0026quot;' data-bordered='true' data-target_direction='\u0026quot;increase\u0026quot;'\u003E\u003C/marimo-stat\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "1c26310d509b6fdd6305deb4da08418c", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/html": "\u003Cmarimo-callout-output data-html='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003ch3 id=\u0026#92;\u0026quot;conclusions\u0026#92;\u0026quot;\u0026#92;u003eConclusions\u0026#92;u003c/h3\u0026#92;u003e\u0026#92;n\u0026#92;u003cul\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003eAreal variation is significant and will have a minor impact on national hotspot identification, biasing away from the northeast to the southwest. Hotspot rankings in H3 cells should be weighted by area to avoid this.\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003eFurthermore, because the variation is geographical it can cause artefacts, such as prioritising ranking of same-count cells in the north-east of a region. This is particularly noticeable for low-frequency crimes.\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003eSumming counts in child cells to get a parent cell count will introduce significant errors. However, this is mitigated by H3 extremely efficient indexing, so mapping to different resolutions is not expensive and can often be precomputed. So H3\u0026#x27;s non-strict hierarchy is not considered to be a major issue in our case.\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003eH3 is designed to be a \u0026#92;u003cem\u0026#92;u003eglobal\u0026#92;u003c/em\u0026#92;u003e system which by necessity involves projection compromises. Our use case is national, so many of the features of H3 are not useful to us and can actually complicate analysis. The one feature of H3 that is extremely useful is fast indexing.\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003cli\u0026#92;u003eA proprietary approach that\u0026#x27;s native to the British National Grid, providing equal-area hex cells with fast indexing would be preferable to H3.\u0026#92;u003c/li\u0026#92;u003e\u0026#92;n\u0026#92;u003c/ul\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;success\u0026quot;'\u003E\u003C/marimo-callout-output\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.25.1", "script_metadata_hash": null}, "version": "1"},
